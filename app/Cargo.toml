[package]
name = "screenforge"
description = "Arrange smartphone screenshots into a single presentation image — a native GNOME app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
cairo-rs = { version = "0.22.9", features = ["png"] }
gio = "0.22.9"
glib = "0.22.9"
gtk4 = { version = "0.11.4", features = ["v4_22"] }
image = { version = "0.25.10", features = ["avif"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
screenforge-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[build-dependencies]
glib-build-tools = "0.22.8"
